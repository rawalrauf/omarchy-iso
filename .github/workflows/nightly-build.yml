name: Build ISO

on:
  schedule:
    - cron: '1 0 * * *'  # Daily at 00:01 UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ISO
      run: |
        mkdir -p release
        docker run --rm \
          --privileged \
          -e "OMARCHY_INSTALLER_REPO=rawalrauf/omarchy" \
          -e "OMARCHY_INSTALLER_REF=main" \
          -e "OMARCHY_MIRROR=stable" \
          -e "HOST_UID=$(id -u)" \
          -e "HOST_GID=$(id -g)" \
          -v "${{ github.workspace }}:/workspace" \
          -v "${{ github.workspace }}/release:/out" \
          archlinux/archlinux:latest \
          bash -c "
            pacman -Sy --noconfirm archlinux-keyring &&
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm git sudo jq &&
            cp -r /workspace/builder /builder &&
            cp -r /workspace/configs /configs &&
            mkdir -p /out &&
            bash /builder/build-iso.sh
          " 2>&1 | tee /tmp/build.log; status=${PIPESTATUS[0]}; grep -i 'broadcom\|apple-bcm\|target not found\|error:' /tmp/build.log | head -20; exit $status

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: omarchy-iso-${{ github.run_number }}
        path: release/*.iso
        retention-days: 30
