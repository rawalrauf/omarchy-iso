name: Build ISO

on:
  schedule:
    - cron: '1 0 * * *'  # Daily at 00:01 UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Pull Arch Linux image
      run: docker pull archlinux/archlinux:latest

    - name: Build ISO
      run: |
        mkdir -p release
        NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --no-cache

    - name: Get ISO filename
      id: iso
      run: echo "file=$(ls release/*.iso | head -1)" >> $GITHUB_OUTPUT

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: omarchy-iso-${{ github.run_number }}
        path: release/*.iso
        retention-days: 30
