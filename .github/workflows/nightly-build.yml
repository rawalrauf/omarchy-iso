name: Build ISO

on:
  schedule:
    - cron: '1 0 * * *'  # Daily at 00:01 UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-iso:
    runs-on: ubuntu-latest

    container:
      image: archlinux/archlinux:latest
      options: --privileged

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ISO in Arch Linux container
      env:
        OMARCHY_INSTALLER_REPO: rawalrauf/omarchy
        OMARCHY_INSTALLER_REF: main
        OMARCHY_MIRROR: stable
        HOST_UID: "1001"
        HOST_GID: "1001"
      run: |
        docker run --rm \
          --privileged \
          -e "OMARCHY_INSTALLER_REPO=$OMARCHY_INSTALLER_REPO" \
          -e "OMARCHY_INSTALLER_REF=$OMARCHY_INSTALLER_REF" \
          -e "OMARCHY_MIRROR=$OMARCHY_MIRROR" \
          -e "HOST_UID=$HOST_UID" \
          -e "HOST_GID=$HOST_GID" \
          -v "${{ github.workspace }}:/workspace" \
          -v "${{ github.workspace }}/release:/out" \
          archlinux/archlinux:latest \
          bash -c "
            pacman -Sy --noconfirm archlinux-keyring &&
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm git sudo jq &&
            chmod +x /workspace/builder/build-iso.sh &&
            cp -r /workspace/builder /builder &&
            cp -r /workspace/configs /configs &&
            cp -r /workspace/archiso /archiso &&
            mkdir -p /out &&
            OMARCHY_INSTALLER_REPO=$OMARCHY_INSTALLER_REPO \
            OMARCHY_INSTALLER_REF=$OMARCHY_INSTALLER_REF \
            OMARCHY_MIRROR=$OMARCHY_MIRROR \
            HOST_UID=$HOST_UID \
            HOST_GID=$HOST_GID \
            bash /builder/build-iso.sh
          "

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: omarchy-iso-${{ github.run_number }}
        path: release/*.iso
        retention-days: 30
